# NetworkLab Client configuration template
# Format: INI / UTF-8; copied to ~/.networklab/config/c.conf on installation.
# NetworkLab v0.1.0 only reads/validates configuration; no network tests.

[general]
config_version = 1
default_profile = standard

[network]
preferred_ip_family = auto

[proxy]
# A local proxy endpoint, not proof that traffic uses a particular exit node.
# Verify the actual exit per target in future proxy measurements.
protocol = http
host = 127.0.0.1
port = 7890

[paths]
# Relative paths resolve against the containing c.conf directory.
targets_file = targets.conf
