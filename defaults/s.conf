# NetworkLab Server configuration template
# Format: INI / UTF-8; copied to ~/.networklab/config/s.conf on installation.
# The installer MUST replace CHANGE_ME with a unique, valid server_id.
# v0.1.0 parses and validates schedules but never enables or creates any timer.

[general]
config_version = 1
server_id = CHANGE_ME
timezone = UTC+08:00
default_profile = standard
enable_heavy_tests = false

[profile.quick]
netquality = lite
tcpquality = lite
hardwarequality = off
ipquality = lite
nexttrace = lite
mtr = lite
flent = off

[profile.standard]
netquality = normal
tcpquality = normal
hardwarequality = lite
ipquality = normal
nexttrace = normal
mtr = normal
flent = off

[profile.deep]
netquality = full
tcpquality = full
hardwarequality = full
ipquality = full
nexttrace = full
mtr = full
flent = full

[tool.hardwarequality]
enabled = true
profile_override = inherit

[tool.flent]
enabled = true
profile_override = inherit

[limits]
# 0 means NO allowance for explicitly metered/high-volume test runs.
# This does not claim zero traffic for other low-impact diagnostic tools.
max_metered_mb_per_run = 0
max_metered_mb_per_day = 0

[schedule.peak]
enabled = false
time = 20:30
days = daily
profile = standard
modules = inventory,netquality,tcpquality
